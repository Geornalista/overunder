<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatísticas Over / Under Gols</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{--bg:#eef2f7;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe3ec;--blue:#2563eb;--green:#15803d;--shadow:0 8px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.container{max-width:1520px;margin:auto;padding:22px}.header{background:linear-gradient(135deg,#0b1220,#1e293b);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#93c5fd}h1{margin:5px 0 6px;font-size:clamp(28px,3vw,40px);line-height:1.1;letter-spacing:-.04em}.subtitle{margin:0;color:#cbd5e1;font-size:15px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;box-shadow:var(--shadow)}
label{display:block;font-size:14px;font-weight:750;margin-bottom:7px;color:#334155}select{width:100%;height:50px;padding:0 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--text);font-size:16px;outline:none}select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.status{margin:13px 0 0;padding:10px 14px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:14px;border:1px solid #dbeafe;display:none}.status.error{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 3px 10px}.summary h2{font-size:21px;margin:0;letter-spacing:-.02em}.summary span{font-size:14px;color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart-card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.chart-title{padding:16px 19px 11px;border-bottom:1px solid var(--border);font-size:18px;font-weight:800}.chart-subtitle{font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}.chart{width:100%;height:820px}.footer{padding:13px 4px 0;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:950px){.charts{grid-template-columns:1fr}.chart{height:760px}}
@media(max-width:600px){.container{padding:9px}.header{padding:21px 18px;border-radius:15px}h1{font-size:27px}.subtitle{font-size:14px;line-height:1.4}.controls{grid-template-columns:1fr;padding:13px;border-radius:13px}select{height:50px;font-size:16px}.summary{display:block;margin:15px 3px 9px}.summary h2{font-size:18px}.summary span{display:block;margin-top:3px}.chart-card{border-radius:13px}.chart-title{padding:14px 15px;font-size:17px}.chart{height:760px}}
</style>
</head>
<body>
<div class="container">
<section class="header"><div class="eyebrow">Football Analytics</div><h1>Estatísticas Over / Under Gols</h1><p class="subtitle">Análise de gols por equipe como mandante e visitante.</p></section>
<section class="controls">
<div><label for="league">Escolha a liga</label><select id="league"></select></div>
<div><label for="attribute">Escolha o atributo</label><select id="attribute"><option>Over 0.5</option><option>Over 1.5</option><option>Over 2.5</option><option>Ambos Marcam</option><option>Jogos 0x0</option></select></div>
</section>
<div id="status" class="status"></div>
<div class="summary"><h2 id="summaryTitle">Análise</h2><span id="summaryInfo"></span></div>
<section class="charts">
<div class="chart-card"><div class="chart-title">Mandante<div class="chart-subtitle">Percentual de jogos no estádio do clube</div></div><div id="homeChart" class="chart"></div></div>
<div class="chart-card"><div class="chart-title">Visitante<div class="chart-subtitle">Percentual de jogos fora de casa</div></div><div id="awayChart" class="chart"></div></div>
</section>
</div>

<script>
const leagues=["Alemanha","Alemanha2","Espanha","Espanha2","França","França2","Inglaterra","Inglaterra2","Itália","Itália2","Bélgica","Holanda","Portugal","Turquia","Grécia","Escócia","Dinamarca","Noruega","Suíça","Suécia","Brasil","Austrália"];
const codes={"Alemanha":"D1","Alemanha2":"D2","Espanha":"SP1","Espanha2":"SP2","França":"F1","França2":"F2","Inglaterra":"E0","Inglaterra2":"E1","Itália":"I1","Itália2":"I2","Bélgica":"B1","Holanda":"N1","Portugal":"P1","Turquia":"T1","Grécia":"G1","Escócia":"SC0"};
const leagueEl=document.getElementById("league"),attrEl=document.getElementById("attribute"),statusEl=document.getElementById("status");
leagues.forEach(l=>{let o=document.createElement("option");o.value=l;o.textContent=l;leagueEl.appendChild(o)});
function status(t,on=true){statusEl.textContent=t;statusEl.style.display=on?"block":"none"}
async function getText(path){let r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error("Arquivo de dados não encontrado: "+path);return r.text()}
function csv(text){let rows=[],row=[],f="",q=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c=='"'){if(q&&n=='"'){f+='"';i++}else q=!q}else if(c==","&&!q){row.push(f);f=""}else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&n=="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);rows.push(row)}if(!rows.length)return[];let h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((x,i)=>[x,(r[i]??"").trim()])));}
function norm(rows){return rows.map(r=>({Home:r.HomeTeam??r.Home??"",Away:r.AwayTeam??r.Away??"",HG:Number(r.FTHG??r.HG),AG:Number(r.FTAG??r.AG),Season:r.Season??r.SEASON??""})).filter(r=>r.Home&&r.Away&&Number.isFinite(r.HG)&&Number.isFinite(r.AG))}
async function load(league){
 if(codes[league])return norm(csv(await getText(`data/football-data/${codes[league]}.csv`)));
 if(["Dinamarca","Suíça","Noruega","Suécia","Brasil"].includes(league)){
   let file={Dinamarca:"DNK.csv",Suíça:"SWZ.csv",Noruega:"NOR.csv",Suécia:"SWE.csv",Brasil:"BRA.csv"}[league];
   let rows=norm(csv(await getText(`data/football-data/${file}`)));
   return rows.filter(r=>["Dinamarca","Suíça"].includes(league)?r.Season==="2026/2027":r.Season==="2026");
 }
 if(league==="Austrália"){
   let r=await fetch("data/australia/a-league.xlsx",{cache:"no-store"});if(!r.ok)throw new Error("Arquivo da Austrália não encontrado");
   let wb=XLSX.read(await r.arrayBuffer(),{type:"array",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
   return XLSX.utils.sheet_to_json(ws,{range:1,defval:""}).map(x=>({Home:x["Home Team"]??"",Away:x["Away Team"]??"",HG:Number(x["Home Goals"]),AG:Number(x["Away Goals"]),Date:x.Date})).filter(x=>x.Home&&x.Away&&Number.isFinite(x.HG)&&Number.isFinite(x.AG)&&new Date(x.Date)>new Date("2025-10-01"));
 }
 throw new Error("Liga não configurada");
}
function calc(data,a){
 let clubs=[...new Set(data.flatMap(r=>[r.Home,r.Away]))],out=[];
 for(let c of clubs){let h=data.filter(r=>r.Home===c),v=data.filter(r=>r.Away===c);let m=rows=>{if(!rows.length)return 0;let n=0;for(let r of rows){let g=r.HG+r.AG,b=r.HG>0&&r.AG>0,ok=a==="Over 0.5"?g>.5:a==="Over 1.5"?g>1.5:a==="Over 2.5"?g>2.5:a==="Ambos Marcam"?b:g<1;if(ok)n++}return +(100*n/rows.length).toFixed(2)};out.push({CLUBE:c,CASA:m(h),FORA:m(v)})}return out
}
function drawSingle(id,rows,key,role){
  const sorted=[...rows].sort((a,b)=>a[key]-b[key]);
  const mobile=window.innerWidth<600;
  const h=mobile?Math.max(700,sorted.length*31+150):Math.max(760,sorted.length*29+145);
  const trace={
    x:sorted.map(r=>r[key]),y:sorted.map(r=>r.CLUBE),type:"bar",orientation:"h",
    marker:{color:role==="Mandante"?"#2563eb":"#15803d"},
    text:sorted.map(r=>r[key].toFixed(1)+"%"),textposition:"outside",cliponaxis:false,
    hovertemplate:"<b>%{y}</b><br>%{x:.2f}%<extra>"+role+"</extra>"
  };
  const layout={
    height:h,margin:{l:mobile?105:145,r:62,t:12,b:48},
    paper_bgcolor:"#ffffff",plot_bgcolor:"#f8fafc",
    font:{family:"Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",size:13,color:"#0f172a"},
    xaxis:{title:{text:"Percentual (%)",font:{size:14}},range:[0,108],dtick:10,ticksuffix:"%",gridcolor:"#dfe6ee",zeroline:false,tickfont:{size:12}},
    yaxis:{automargin:true,tickfont:{size:mobile?13:13},gridcolor:"rgba(0,0,0,0)"},
    showlegend:false,bargap:.18,hoverlabel:{font:{size:14}}
  };
  Plotly.react(id,[trace],layout,{responsive:true,displaylogo:false,scrollZoom:false});
}
function draw(result,league,a){
  document.getElementById("summaryTitle").textContent=a+" · "+league;
  document.getElementById("summaryInfo").textContent=result.length+" clubes analisados";
  drawSingle("homeChart",result,"CASA","Mandante");
  drawSingle("awayChart",result,"FORA","Visitante");
}
async function update(){let l=leagueEl.value,a=attrEl.value;status(`Carregando dados de ${l}...`);try{let d=await load(l);if(!d.length)throw Error("Nenhum jogo encontrado");draw(calc(d,a),l,a);status(`${d.length} jogos analisados em ${l}.`);setTimeout(()=>status("",false),2200)}catch(e){console.error(e);status("Não foi possível carregar os dados: "+e.message);Plotly.purge("homeChart");Plotly.purge("awayChart")}}
leagueEl.addEventListener("change",update);
attrEl.addEventListener("change",update);
let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    ["homeChart","awayChart"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) Plotly.Plots.resize(el);
    });
  },150);
});
update();
</script>
</body>
</html>
